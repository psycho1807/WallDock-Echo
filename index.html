
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101923">
  <title>WallDock Echo Edition</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #101923;
      color: white;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
    }

    header {
      padding: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    h1 {
      margin: 0;
      font-size: 30px;
    }

    small {
      color: #78caff;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    #clock {
      font-size: 25px;
      font-weight: bold;
    }

    #fullscreenBtn {
      padding: 14px 20px;
      background: #253747;
      border: 1px solid #45627a;
      border-radius: 12px;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    main {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      padding: 24px;
      padding-bottom: 110px;
    }

    .tile {
      background: #253747;
      border: 1px solid #36536b;
      border-radius: 18px;
      color: white;
      padding: 30px 12px;
      font-size: 22px;
      cursor: pointer;
      min-height: 120px;
    }

    .tile:active {
      background: #315776;
    }

    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: #1d3042;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 18px;
      z-index: 10;
    }

    nav span {
      font-size: 24px;
    }

    #message {
      text-align: center;
      color: #9bb5c9;
      padding: 10px;
      font-size: 15px;
    }

    @media (max-width: 700px) {
      main {
        grid-template-columns: repeat(2, 1fr);
      }

      header {
        padding: 16px;
      }

      h1 {
        font-size: 24px;
      }

      #clock {
        font-size: 20px;
      }

      #fullscreenBtn {
        padding: 10px;
        font-size: 15px;
      }

      .tile {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div>
      <h1>WallDock</h1>
      <small>ECHO EDITION</small>
    </div>

    <div class="header-right">
      <span id="clock"></span>
      <button id="fullscreenBtn"
              onclick="toggleFullscreen()">
        ⛶ Plein écran
      </button>
    </div>
  </header>

  <main>
    <button class="tile">🏠 Maison</button>
    <button class="tile">💡 Lumières</button>
    <button class="tile">🪟 Volets</button>
    <button class="tile">📷 Caméras</button>
    <button class="tile">🛡️ Alarme</button>
    <button class="tile">🌡️ Climatisation</button>
  </main>

  <div id="message">
    WallDock Echo Edition
  </div>

  <nav>
    <span>🏠</span>
    <span>📷</span>
    <span>📅</span>
    <span>🎵</span>
    <span>⚙️</span>
  </nav>

  <script>
    function updateClock() {
      document.getElementById("clock").textContent =
        new Date().toLocaleTimeString("fr-FR", {
          hour: "2-digit",
          minute: "2-digit"
        });
    }

    updateClock();
    setInterval(updateClock, 1000);

    async function toggleFullscreen() {
      const page = document.documentElement;
      const button =
        document.getElementById("fullscreenBtn");
      const message =
        document.getElementById("message");

      try {
        if (document.fullscreenElement) {
          if (document.exitFullscreen) {
            await document.exitFullscreen();
          }
        } else {
          const request =
            page.requestFullscreen ||
            page.webkitRequestFullscreen;

          if (!request) {
            throw new Error(
              "API Fullscreen non disponible"
            );
          }

          await request.call(page);
        }

        message.textContent =
          "Demande de plein écran envoyée";
      } catch (error) {
        message.textContent =
          "Le navigateur refuse le plein écran";
      }

      updateFullscreenButton();
    }

    function updateFullscreenButton() {
      const button =
        document.getElementById("fullscreenBtn");

      button.textContent =
        document.fullscreenElement
          ? "⛶ Quitter"
          : "⛶ Plein écran";
    }

    document.addEventListener(
      "fullscreenchange",
      updateFullscreenButton
    );
  </script>

</body>
</html>
